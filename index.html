<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Tablero</title>
<meta name="theme-color" content="#1f6f5c">
<meta name="description" content="Proyectos, tareas, hábitos e ideas. Funciona sin internet.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Tablero">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first single column; sticky title bar on top, fixed tab bar (Proyectos / Hábitos / Ideas) at the bottom */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --surface-2:#eceef3; --fg:#161922; --muted:#5d6475; --line:#dde0e8;
  --accent:#1f6f5c; --accent-soft:#d9efe8; --accent-fg:#ffffff; --danger:#b3261e; --warn:#a86a00;
  --font-display:"Sora","Segoe UI",system-ui,sans-serif;
  --font-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:14px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --surface:#181b22; --surface-2:#22262f; --fg:#eceef3; --muted:#9aa1b2; --line:#2b303b;
  --accent:#4fbf9f; --accent-soft:#183a31; --accent-fg:#06211a; --danger:#ff8a80; --warn:#f0b54a; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1115; --surface:#181b22; --surface-2:#22262f; --fg:#eceef3; --muted:#9aa1b2; --line:#2b303b;
  --accent:#4fbf9f; --accent-soft:#183a31; --accent-fg:#06211a; --danger:#ff8a80; --warn:#f0b54a; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font-body);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px}
.ttl{display:flex;align-items:center;gap:10px;min-width:0}
.back{border:0;background:var(--surface-2);color:var(--fg);width:34px;height:34px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
h1{font-family:var(--font-display);font-size:1.2rem;margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] .dot{background:#2e9e6a}.sync[data-s="wait"] .dot{background:#d99a1e}.sync[data-s="off"] .dot{background:var(--danger)}
main{padding-block:16px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
h2{font-family:var(--font-display);font-size:1.02rem;margin:0}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.note{font-size:.84rem;color:var(--muted);margin:0}
.picon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--pc);flex:0 0 auto}
.picon.sm{width:26px;height:26px;border-radius:8px}.picon.sm svg.i{width:15px;height:15px}
.cards{display:flex;flex-direction:column;gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;gap:12px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%;align-items:flex-start}
.pcard:hover{border-color:var(--pc)}
.pcard .body{flex:1;min-width:0;display:grid;gap:4px}
.pcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pcard .name{font-family:var(--font-display);font-weight:600}
.pcard .meta{font-size:.76rem;color:var(--muted);white-space:nowrap}
.pcard .ln{font-size:.88rem;overflow-wrap:anywhere}
.pcard .ln .k{color:var(--muted)}
.empty{color:var(--muted);font-style:italic}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:10px}
textarea,input[type=text],input[type=date],select{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:10px 12px}
textarea,input[type=text]{width:100%}
textarea{resize:vertical}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
select{padding:8px 10px;max-width:100%;min-width:0}
ul.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
ul.list li{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-top:1px solid var(--line)}
ul.list li:first-child{border-top:0}
ul.list .txt{flex:1;min-width:0;overflow-wrap:anywhere;padding-top:1px;display:grid;gap:4px}
ul.list li.done .txt>span:first-child{color:var(--muted);text-decoration:line-through}
.chk{appearance:none;width:22px;height:22px;flex:0 0 22px;border:2px solid var(--muted);border-radius:7px;margin:0;cursor:pointer;display:grid;place-items:center;background:transparent}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-fg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:0;font-family:var(--font-body);cursor:default}
button.chip{cursor:pointer}
.chip svg.i{width:12px;height:12px}
.chip.late{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.chip.today{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.proj{color:#fff;background:var(--pc)}
.ibtn{border:0;background:none;color:var(--muted);cursor:pointer;font:500 .8rem var(--font-body);padding:4px 6px;border-radius:6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.ibtn:hover{background:var(--surface-2);color:var(--fg)}
.ibtn svg.i{width:16px;height:16px}
.blank{color:var(--muted);font-size:.9rem;padding:14px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius)}
details summary{cursor:pointer;color:var(--muted);font-size:.85rem;padding:4px 0}
details[open] summary{margin-bottom:8px}
.btn{border:0;background:var(--accent);color:var(--accent-fg);font:600 .9rem var(--font-body);padding:10px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.danger{background:none;color:var(--danger);padding-inline:6px}
.btn:disabled{opacity:.5;cursor:default}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline>input[type=text]{flex:1 1 180px;min-width:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px}
.iconpick button{width:38px;height:38px;border-radius:10px;border:2px solid transparent;background:var(--surface-2);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.iconpick button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button[aria-pressed="true"]{border-color:var(--fg)}
/* next step card */
.nextcard{border-top:5px solid var(--pc)}
/* timeline */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li::before{content:"";position:absolute;left:8px;top:14px;bottom:-4px;width:2px;background:var(--line)}
.tl li:last-child::before{display:none}
.tl .nd{position:absolute;left:1px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 4px var(--bg)}
.tl li.task .nd{width:12px;height:12px;left:3px;top:5px;background:var(--bg);border:2.5px solid var(--pc)}
.tl li.now .nd{background:var(--bg);border:2.5px dashed var(--pc)}
.tl .when{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl .what{font-weight:500;overflow-wrap:anywhere}
.tl li.task .what{font-weight:400}
.tl li.now .what{color:var(--muted)}
.tl .nt{font-size:.88rem;color:var(--muted);overflow-wrap:anywhere;white-space:pre-wrap}
.tl button.open{all:unset;cursor:pointer;display:grid;gap:2px;width:100%}
.tl button.open:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.tl .edit{display:grid;gap:8px;margin-top:8px}
/* habits */
.hsum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.stat b{font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.74rem;color:var(--muted)}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:90px;padding-top:6px}
.bar{display:grid;gap:4px;justify-items:center;height:100%;grid-template-rows:1fr auto}
.bar .col{width:100%;max-width:26px;background:var(--surface-2);border-radius:6px;position:relative;overflow:hidden;align-self:stretch}
.bar .fill{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:6px}
.bar small{font-size:.7rem;color:var(--muted)}
.bar.today small{color:var(--fg);font-weight:700}
.habit{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:grid;gap:10px}
.habit .top{display:flex;align-items:center;gap:12px}
.hcheck{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:transparent;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.hcheck[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.hcheck svg.i{width:24px;height:24px;stroke-width:3}
.habit .hn{flex:1;min-width:0;display:grid;gap:2px;text-align:left;background:none;border:0;color:var(--fg);font:inherit;cursor:pointer;padding:0}
.habit .hn b{font-weight:600;overflow-wrap:anywhere}
.habit .hn span{font-size:.78rem;color:var(--muted);display:flex;gap:4px;align-items:center}
.habit .hn span svg.i{width:14px;height:14px;color:#e5602b}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:3px;font-size:.68rem;color:var(--muted)}
.wd button{width:100%;max-width:34px;aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:transparent;cursor:pointer;padding:0}
.wd button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.wd button:disabled{opacity:.35;cursor:default}
.wd.today{color:var(--fg);font-weight:700}
.wd.today button{border-color:var(--fg)}
.hdetail{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav b{font-family:var(--font-display);font-size:.95rem;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:.68rem;color:var(--muted);text-align:center}
.cal .c{aspect-ratio:1;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.cal .c.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
.cal .c.td{outline:2px solid var(--fg);outline-offset:-2px}
.cal .c.fut{opacity:.4}
.cal .c.x{background:transparent}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mini .stat{padding:8px}
.mini .stat b{font-size:1.05rem}
/* bottom nav */
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h)}
nav.tabbar button{border:0;background:none;color:var(--muted);font:600 .74rem var(--font-body);display:grid;justify-items:center;align-content:center;gap:3px;cursor:pointer}
nav.tabbar button[aria-current="true"]{color:var(--accent)}
nav.tabbar svg.i{width:22px;height:22px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.88rem;display:flex;gap:12px;align-items:center;z-index:8;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--bg);font:700 .88rem var(--font-body);text-decoration:underline;cursor:pointer}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:7;width:56px;height:56px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.22);cursor:pointer}
.fab svg.i{width:26px;height:26px;stroke-width:2.5}
dialog.modal{border:0;padding:0;border-radius:18px;background:var(--surface);color:var(--fg);width:min(520px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto}
dialog.modal::backdrop{background:rgba(10,12,16,.55)}
.mbody{padding:18px;display:grid;gap:10px}
.mbody h3{font-family:var(--font-display);margin:0 0 4px;font-size:1.15rem;text-wrap:balance}
.mbody input[type=date],.mbody select{width:100%}
.mfoot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.quote{border-left:4px solid var(--pc);background:var(--surface-2);border-radius:10px;padding:10px 12px;display:grid;gap:2px;overflow-wrap:anywhere}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px;max-width:100%}
.seg button{border:0;background:none;color:var(--muted);font:600 .8rem var(--font-body);padding:6px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button svg.i{width:15px;height:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.current{background:var(--pc);color:#fff;border-radius:18px;padding:16px;display:grid;gap:12px}
.current .lbl{color:rgba(255,255,255,.85)}
.current .picon{background:rgba(255,255,255,.2)}
.current .big{font-family:var(--font-display);font-size:1.4rem;font-weight:600;line-height:1.3;overflow-wrap:anywhere;text-wrap:balance}
.current .big.none{font-size:1rem;font-weight:500;opacity:.9}
.current .meta{font-size:.8rem;opacity:.85}
.current .ibtn.on-pc{color:#fff}
.current .ibtn.on-pc:hover{background:rgba(255,255,255,.15)}
.btn.light{background:#fff;color:#161922}
.btn.ghostpc{background:rgba(255,255,255,.18);color:#fff}
.ovs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ov{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:1px;text-align:left;color:var(--fg);font:inherit;min-width:0}
button.ov{cursor:pointer}
.ov b{font-family:var(--font-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.ov span{font-size:.76rem;font-weight:600}
.ov small{font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov.warn small{color:var(--danger);font-weight:600}
@media (max-width:380px){.ovs{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:var(--radius);padding:12px;display:grid;gap:8px;align-content:start;text-align:left;color:var(--fg);font:inherit;min-width:0}
button.tile{cursor:pointer}
.tile .tt{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tile .nm{font-family:var(--font-display);font-weight:600;font-size:.92rem;overflow-wrap:anywhere}
.tile .st{font-size:.84rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tile .ft{font-size:.72rem;color:var(--muted);white-space:nowrap}
.tile.done .ttext{color:var(--muted);text-decoration:line-through}
.ttext{all:unset;cursor:pointer;overflow-wrap:anywhere;display:block}
.ttext:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
li.done .ttext{color:var(--muted);text-decoration:line-through}
.chip.p1{background:color-mix(in srgb,var(--danger) 15%,transparent);color:var(--danger)}
.chip.p2{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.chip.p3{background:var(--surface-2);color:var(--muted)}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.daypick button{aspect-ratio:1;max-width:44px;width:100%;justify-self:center;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--muted);font:700 .85rem var(--font-body);cursor:pointer}
.daypick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
input[type=time]{font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid transparent;border-radius:10px;padding:9px 12px}
.wd button.off{border-style:dashed;opacity:.45}
.wd button.off[aria-pressed="true"]{opacity:1}
.cal .c.off{background:transparent;border:1px dashed var(--line)}
.cal .c.off.on{background:var(--accent);border:0}
.habit.rest{opacity:.7}
.habit .hn span.freq{color:var(--muted);font-size:.74rem}
.hello{display:grid;gap:2px}
.hello h2{font-size:1.35rem}
button.current.focus{border:0;text-align:left;font:inherit;cursor:pointer;width:100%}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.area{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:grid;gap:2px;text-align:left;color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.area:hover{border-color:var(--accent)}
.area .aico{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:6px}
.area .aname{font-size:.8rem;font-weight:600;color:var(--muted)}
.area b{font-family:var(--font-display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.area small{font-size:.74rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.area small.bad{color:var(--danger);font-weight:600}
.qh{display:flex;flex-wrap:wrap;gap:8px}
.qhb{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:500 .88rem var(--font-body);padding:8px 12px 8px 8px;border-radius:999px;cursor:pointer;max-width:100%}
.qhb .qc{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:0 0 auto}
.qhb .qc svg.i{width:14px;height:14px;stroke-width:3}
.qhb[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.qhb[aria-pressed="true"] .qc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}

/* ---------- nube: Firebase (Firestore guarda copia y cola sin internet) ---------- */
const CFG=self.FB_CONFIG||{},HAS_FB=!!(CFG.apiKey&&window.firebase);
let fs=null,auth=null,user=null,fbPending=0,unsubs=[],collPending={},prefs={},msgReady=false;
function scoped(){const b="users/"+user.uid+"/";return{doc:p=>fs.doc(b+p),collection:c=>fs.collection(b+c)}}
function flush(){
  if(!db||!outbox.length){updateSync();return}
  const ops=outbox;outbox=[];persist();
  for(const op of ops){let p;try{const ref=db.doc(op.path);p=op.data===null?ref.delete():ref.set(op.data)}catch(e){console.warn(e);continue}
    fbPending++;p.then(()=>{lastError=false},()=>{lastError=true}).finally(()=>{fbPending--;updateSync()})}
  updateSync();
}
window.addEventListener("online",()=>{flush();flushMedia();updateSync()});
window.addEventListener("offline",updateSync);
function updateSync(){
  const s=$("sync"),t=$("syncTxt");
  if(!HAS_FB){s.dataset.s="off";t.textContent="Solo en este dispositivo";return}
  if(!user){s.dataset.s=outbox.length?"wait":"off";t.textContent=outbox.length?"Sin sesión · "+outbox.length+" por subir":"Sin sesión";return}
  const pend=fbPending>0||outbox.length>0||Object.values(collPending).some(Boolean);
  if(!navigator.onLine){s.dataset.s="off";t.textContent=pend?"Sin internet · se sube al volver":"Sin internet · todo a salvo aquí";return}
  if(pend){s.dataset.s="wait";t.textContent="Guardando…";return}
  if(!gotServer){s.dataset.s="wait";t.textContent="Conectando…";return}
  s.dataset.s=lastError?"off":"ok";t.textContent=lastError?"Error al guardar · reintentando":"Guardado en la nube";
}
function merge(coll,snap){
  const pending=new Set(outbox.map(o=>o.path)),next={};
  for(const d of snap.docs){if(!pending.has(coll+"/"+d.id))next[d.id]=Object.assign({},d.data(),{id:d.id})}
  for(const o of outbox){if(o.path.startsWith(coll+"/")&&o.data){const id=o.path.slice(coll.length+1);next[id]=Object.assign({},o.data,{id})}}
  state[coll]=next;
}
function connect(){
  registerSW();
  if(!HAS_FB){updateSync();render();return}
  firebase.initializeApp(CFG);auth=firebase.auth();fs=firebase.firestore();
  try{fs.settings({ignoreUndefinedProperties:true,merge:true})}catch(e){}
  fs.enablePersistence({synchronizeTabs:true}).catch(e=>console.warn("persistencia",e&&e.code));
  auth.getRedirectResult().catch(gateError);
  auth.onAuthStateChanged(u=>{
    unsubs.forEach(f=>{try{f()}catch(e){}});unsubs=[];collPending={};
    user=u;
    if(!u){db=null;gotServer=false;showGate(true);updateSync();return}
    lsSet(LS.who,u.uid);showGate(false);db=scoped();gotServer=false;
    const seen={};
    const handle=coll=>snap=>{collPending[coll]=snap.metadata.hasPendingWrites;merge(coll,snap);
      if(!snap.metadata.fromCache){seen[coll]=true;if(COLLS.every(c=>seen[c]))gotServer=true}
      persist();updateSync();render()};
    const onErr=e=>{console.warn(e);lastError=true;updateSync()};
    for(const c of COLLS)unsubs.push(db.collection(c).limit(2000).onSnapshot({includeMetadataChanges:true},handle(c),onErr));
    unsubs.push(fs.doc("users/"+u.uid).onSnapshot(s=>{prefs=s.data()||{};if(ui.view==="dash")render()},()=>{}));
    flush();flushMedia();registerToken();
  });
}
function savePrefs(patch){if(!fs||!user)return;Object.assign(prefs,patch);fs.doc("users/"+user.uid).set(patch,{merge:true}).catch(()=>{})}

/* ---------- entrada con Google ---------- */
function showGate(on){
  let g=$("gate");
  if(!on){if(g)g.hidden=true;document.body.classList.remove("gated");return}
  if(!g){
    const btn=el("button",{class:"btn big",type:"button",onclick:signIn},"Entrar con Google");
    g=el("div",{class:"gate",id:"gate"},el("div",{class:"gbox"},el("span",{class:"glogo"},ic("brain")),el("h2",{text:"Mi Tablero"}),
      el("p",{class:"note",text:"Entra con tu cuenta de Google para que tus cosas se guarden en la nube y estén igual en tu celular y tu PC. Solo la primera vez necesitas internet."}),
      btn,el("p",{class:"note err",id:"gateErr",hidden:true}),
      el("button",{class:"btn ghost",type:"button",onclick:()=>showGate(false)},"Usar sin cuenta por ahora")));
    document.body.append(g);
  }
  g.hidden=false;document.body.classList.add("gated");

function gateError(e){if(!e||e.code==="auth/popup-closed-by-user"||e.code==="auth/cancelled-popup-request")return;const p=$("gateErr");
  const m=e.code==="auth/network-request-failed"?"No hay internet. Conéctate para entrar la primera vez.":e.code==="auth/unauthorized-domain"?"Falta autorizar esta dirección en Firebase (Authentication > Configuración > Dominios autorizados).":"No se pudo entrar ("+(e.code||"error")+"). Intenta otra vez.";
  if(p){p.textContent=m;p.hidden=false}else toast(m)}
function signIn(){
  const pr=new firebase.auth.GoogleAuthProvider();pr.setCustomParameters({prompt:"select_account"});
  auth.signInWithPopup(pr).catch(e=>{if(e&&/popup-blocked|operation-not-supported/.test(e.code||""))auth.signInWithRedirect(pr).catch(gateError);else gateError(e)});
}
function signOut(){
  confirmBox("¿Cerrar sesión en este dispositivo?","Tus datos siguen en la nube. Al volver a entrar aparecen otra vez.","Cerrar sesión",async()=>{
    try{await auth.signOut()}catch(e){}
    for(const c of COLLS)state[c]={};outbox=[];persist();try{await fs.clearPersistence()}catch(e){}
    render();
  });
}
function confirmBox(title,body,okTxt,onOk){

let swReg=null;
function registerSW(){
  if(!("serviceWorker"in navigator))return;
  navigator.serviceWorker.register("sw.js").then(r=>{swReg=r;setInterval(()=>r.update().catch(()=>{}),3600000)}).catch(e=>console.warn("sw",e));
  let reloaded=false;

const notifOk=()=>"Notification"in window&&"serviceWorker"in navigator;
async function registerToken(){
  if(!HAS_FB||!user||!notifOk()||Notification.permission!=="granted"||!self.FB_VAPID)return false;
  try{
    if(firebase.messaging.isSupported&&!(await firebase.messaging.isSupported()))return false;
    const reg=await navigator.serviceWorker.ready,m=firebase.messaging();
    const tok=await m.getToken({vapidKey:self.FB_VAPID,serviceWorkerRegistration:reg});
    if(tok){const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||"America/Hermosillo";
      await fs.doc("users/"+user.uid).set({tz,tokens:{[tok]:Date.now()}},{merge:true});lsSet(LS.tok,tok)}
    if(!msgReady){msgReady=true;m.onMessage(p=>{const d=p.data||{};reg.showNotification(d.title||"Mi Tablero",{body:d.body||"",tag:d.tag||undefined,icon:"icons/icon-192.png",badge:"icons/badge-96.png",data:{url:d.url||"./"}})})}
    return !!tok;
  }catch(e){console.warn("token",e);return false}
}

function downloadBackup(){
  const b=buildBackup();
  try{const url=URL.createObjectURL(new Blob([b.data],{type:"text/markdown;charset=utf-8"}));
    const a=el("a",{href:url,download:b.filename});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
    lsSet(LS.lastBk,Date.now());toast("Respaldo descargado")}
  catch(e){toast("No se pudo descargar")}
}
function parseBackup(txt){
  let t=txt.trim();const m=t.match(/```json\s*([\s\S]*?)```/);if(m)t=m[1];
  const d=JSON.parse(t);if(!d||typeof d!=="object")throw new Error("vacío");return d;
}
function importFile(){
  const inp=el("input",{type:"file",accept:".json,.md,.txt,application/json,text/markdown,text/plain",style:"display:none"});
  inp.addEventListener("change",async()=>{const f=inp.files&&inp.files[0];inp.remove();if(!f)return;
    let d;try{d=parseBackup(await f.text())}catch(e){toast("Ese archivo no parece un respaldo de Mi Tablero");return}
    let n=0;const cnt={};for(const c of COLLS){const src=d[c];if(!src||typeof src!=="object")continue;cnt[c]=0;
      for(const id in src){const o=src[id];if(!o||typeof o!=="object"||!/^[\w.-]{1,120}$/.test(id))continue;const c2=Object.assign({},o,{id});delete c2.id;
        state[c][id]=Object.assign({},c2,{id});outbox=outbox.filter(x=>x.path!==c+"/"+id);outbox.push({path:c+"/"+id,data:c2});n++;cnt[c]++}}
    persist();flush();render();
    toast(n?"Importado: "+(cnt.projects||0)+" proyectos, "+(cnt.items||0)+" tareas e ideas, "+(cnt.habits||0)+" hábitos":"El archivo no tenía datos");
  });
  document.body.append(inp);inp.click();
}

/* ---------- MEDIA: voz, fotos y dibujos ----------
   Cada archivo se guarda en el aparato (IndexedDB) y en la nube (users/{uid}/media/{id}, como texto base64).
   Las ideas y notas solo guardan la lista att:[{id,type,dur}]. */
const MEDIA_MAX=900000; // límite por archivo en la nube (Firestore acepta 1 MB por documento)
let idbP=null;
function idb(){if(idbP)return idbP;idbP=new Promise((res,rej)=>{try{const r=indexedDB.open("tablero-media",1);r.onupgradeneeded=()=>r.result.createObjectStore("m");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return idbP}
async function idbGet(id){try{const d=await idb();return await new Promise(r=>{const q=d.transaction("m").objectStore("m").get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbPut(id,v){try{const d=await idb();await new Promise(r=>{const t=d.transaction("m","readwrite");t.objectStore("m").put(v,id);t.oncomplete=r;t.onerror=r})}catch(e){}}
const blobToUrl=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=rej;f.readAsDataURL(b)});
async function urlToBlob(u){return (await fetch(u)).blob()}
function mediaQueue(){return lsGet(LS.mq,[])}
async function mediaUpload(id){
  if(!db)return false;const rec=await idbGet(id);if(!rec)return true;
  try{const data=await blobToUrl(rec.blob);if(data.length>MEDIA_MAX*1.37){console.warn("muy grande",id);return true}
    db.doc("media/"+id).set({type:rec.type,mime:rec.blob.type,dur:rec.dur||0,data,createdAt:Date.now()}).catch(e=>console.warn("media",e));return true}
  catch(e){return false}
}
async function flushMedia(){const q=mediaQueue();if(!q.length||!db)return;const left=[];for(const id of q){if(!(await mediaUpload(id)))left.push(id)}lsSet(LS.mq,left)}
async function mediaSave(blob,type,dur){
  const id="m-"+uid();await idbPut(id,{blob,type,dur:dur||0});
  if(!(db&&await mediaUpload(id))){const q=mediaQueue();q.push(id);lsSet(LS.mq,q)}
  return{id,type,dur:dur||0,at:Date.now()};
}
const urlCache={};
async function mediaUrl(id){
  if(urlCache[id])return urlCache[id];
  let rec=await idbGet(id);
  if(!rec&&db){try{const s=await db.doc("media/"+id).get();const d=s.exists?s.data():null;if(d&&d.data){const b=await urlToBlob(d.data);rec={blob:b,type:d.type,dur:d.dur};idbPut(id,rec)}}catch(e){}}
  if(!rec)return null;return urlCache[id]=URL.createObjectURL(rec.blob);
}
function fmtDur(s){s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+":"+pad(s%60)}

/* fotos: se achican para que pesen poco */
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    for(const [max,q] of [[1400,.75],[1100,.65],[800,.6]]){
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement("canvas");
      c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const b=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(b&&b.size<=MEDIA_MAX*.95)return b}
    return null}
  finally{URL.revokeObjectURL(url)}
}

    const types=["audio/webm;codecs=opus","audio/mp4","audio/ogg;codecs=opus"],mt=types.find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));

    chunks=[];t0=Date.now();rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=async()=>{clearInterval(timer);clearTimeout(stopT);stream.getTracks().forEach(t=>t.stop());micBtn.classList.remove("rec");micBtn.lastChild.textContent="Voz";

  const camBtn=el("button",{class:"btn ghost",type:"button"},ic("camera"),el("span",{text:"Cámara"}));camBtn.addEventListener("click",()=>pickPhoto(true));

  drawBtn.addEventListener("click",()=>openPaint(async b=>{list.push(await mediaSave(b,"draw"));paint()}));
  wrap.append(el("div",{class:"attbar"},micBtn,camBtn,photoBtn,drawBtn),items);paint();
  return{node:wrap,get:()=>{stopRec();return list.map(a=>({id:a.id,type:a.type,dur:a.dur||0,at:attTime(a)}))},busy:()=>!!(rec&&rec.state==="recording")};
}

/* ayuda cuando el micrófono no abre */
async function micHelp(err){
  let st="";try{st=(await navigator.permissions.query({name:"microphone"})).state}catch(e){}
  const android=/Android/i.test(navigator.userAgent);
  modal((d,close)=>{

/* ---------- backup download ---------- */
function buildBackup(){

  let md="# Mi Tablero · respaldo "+st+" "+pad(d.getHours())+":"+pad(d.getMinutes())+"\n\n";
  for(const p of projList()){
    md+="## "+(p.name||"Sin nombre")+"\n\n- **Siguiente paso:** "+(p.next||"—")+"\n\n";
    const its=Object.values(state.items).filter(i=>i.project===p.id),t=its.filter(i=>i.kind==="task");
    if(t.length){md+="### Tareas\n\n";t.sort(byDue).forEach(i=>md+="- ["+(i.done?"x":" ")+"] "+i.text+(i.due?" (para "+i.due+")":"")+"\n");md+="\n"}

  }
  const ideas=Object.values(state.items).filter(i=>i.kind==="idea");if(ideas.length){md+="## Ideas\n\n";ideas.forEach(i=>md+="- "+i.text+(state.projects[i.project]?" ("+state.projects[i.project].name+")":"")+"\n");md+="\n"}
  const hs=habitList();if(hs.length){md+="## Hábitos\n\n";hs.forEach(h=>md+="- "+h.name+": racha "+streak(h).n+", "+Object.keys(h.days||{}).length+" días hechos\n");md+="\n"}
  md+="---\n\nDatos completos:\n\n```json\n"+JSON.stringify({exportedAt:d.toISOString(),projects:state.projects,items:state.items,steps:state.steps,habits:state.habits,journal:state.journal},null,1)+"\n```\n";
  return{filename:"mi-tablero-respaldo-"+st+".md",data:md};
}
